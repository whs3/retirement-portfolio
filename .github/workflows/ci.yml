name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Syntax check
      run: |
        python -m py_compile app.py
        python -m compileall -q portfolio
    - name: Import check
      run: python -c "import app; print('App imports successfully'); print(len(list(app.app.url_map.iter_rules())), 'routes')"
    - name: Run tests
      run: pytest -v --tb=short
