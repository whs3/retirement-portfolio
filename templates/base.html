<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="server-timezone" content="{{ server_timezone }}">
  <title>{% block title %}Retirement Portfolio Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    // Attach CSRF token to all state-changing fetch requests automatically
    (function () {
      const token = document.querySelector('meta[name="csrf-token"]').content;
      const _fetch = window.fetch;
      window.fetch = (url, opts = {}) => {
        const method = (opts.method || 'GET').toUpperCase();
        if (['POST', 'PUT', 'DELETE', 'PATCH'].includes(method)) {
          opts.headers = Object.assign({ 'X-CSRFToken': token }, opts.headers || {});
        }
        return _fetch(url, opts);
      };
    })();

    // Robust helper for the app's JSON APIs.
    // Always returns parsed data on success, throws Error with a readable message on failure.
    // Handles rate limits, server errors, and HTML error pages gracefully.
    window.apiFetch = async function (url, opts = {}) {
      const res = await fetch(url, opts);

      const contentType = res.headers.get('content-type') || '';
      let payload = null;

      try {
        if (contentType.includes('application/json')) {
          payload = await res.json();
        } else {
          const text = await res.text();
          // Try to extract something useful from HTML error pages
          const titleMatch = text.match(/<title>(.*?)<\/title>/i);
          payload = titleMatch ? titleMatch[1] : text.slice(0, 300);
        }
      } catch (e) {
        payload = null;
      }

      if (!res.ok) {
        let message = `HTTP ${res.status}`;
        if (payload && typeof payload === 'object' && payload !== null) {
          message = payload.error || payload.message || payload.msg || message;
        } else if (typeof payload === 'string' && payload) {
          message = payload;
        }
        const err = new Error(message);
        err.status = res.status;
        throw err;
      }

      // Successful response should be an object
      if (payload && typeof payload === 'object') {
        return payload;
      }
      // Fallback if somehow not object
      return {};
    };
  </script>
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">RetireTrack (v1.1)</div>
  <ul class="nav-links">
    <li><a href="/"          {% if request.endpoint == 'pages.dashboard'       %}class="active"{% endif %}>Dashboard</a></li>
    <li><a href="/holdings"  {% if request.endpoint == 'pages.holdings_page'   %}class="active"{% endif %}>Holdings</a></li>
    <li><a href="/performance" {% if request.endpoint == 'pages.performance_page' %}class="active"{% endif %}>Performance</a></li>
    <li><a href="/lookup"    {% if request.endpoint == 'pages.lookup_page'     %}class="active"{% endif %}>Price Lookup</a></li>
    <li><a href="/overlap"   {% if request.endpoint == 'pages.overlap_page'    %}class="active"{% endif %}>Overlap</a></li>
    <li><a href="/rebalance" {% if request.endpoint == 'pages.rebalance_page'  %}class="active"{% endif %}>Rebalance</a></li>
    <li><a href="/insights"  {% if request.endpoint == 'pages.insights_page'   %}class="active"{% endif %}>Insights</a></li>
    <li><a href="/audit"     {% if request.endpoint == 'pages.audit_page'      %}class="active"{% endif %}>Audit Log</a></li>
    <li><a href="/api/export/csv" class="btn-nav-export">Export CSV</a></li>
  </ul>
</nav>

<main class="main-content">
  {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
